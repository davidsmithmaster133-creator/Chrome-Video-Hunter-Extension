<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Hunter Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;}
html,body{overflow:hidden;}
body{
  width:520px;height:600px;
  background:#fff;color:#1a1a1a;
  display:flex;flex-direction:column;
}
body.dark{background:#1e1e1e;color:#e0e0e0;}

header{padding:8px 10px;border-bottom:1px solid #e0e0e0;flex-shrink:0;}
body.dark header{border-color:#333;}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
.row:last-child{margin-bottom:0;}
h1{font-size:14px;flex:1;font-weight:600;display:flex;align-items:center;gap:6px;}
.count-badge{
  background:#1976d2;color:#fff;
  border-radius:20px;padding:1px 8px;font-size:11px;font-weight:500;
}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;width:100%;}
.radio-group{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:2px 0;width:100%;}
.radio-group label{display:flex;align-items:center;gap:3px;font-size:12px;cursor:pointer;user-select:none;}
.radio-group input[type=radio]{margin:0;cursor:pointer;accent-color:#1976d2;}

select,input,button{
  font:inherit;color:inherit;background:transparent;
  border:1px solid #e0e0e0;border-radius:4px;
  padding:4px 6px;font-size:12px;
}
body.dark select,body.dark input,body.dark button{border-color:#333;}
input#searchBox{flex:1;min-width:0;}
input#searchBox::placeholder{color:#999;}
input.invalid{border-color:#b42318!important;}

button{cursor:pointer;padding:5px 10px;}
button:hover{background:rgba(0,0,0,0.05);}
body.dark button:hover{background:rgba(255,255,255,0.08);}
.btn-primary{background:#1976d2;color:#fff;border-color:#1976d2;}
.btn-primary:hover{filter:brightness(1.1);}
.btn-9x{background:#ff9800;color:#fff;border-color:#ff9800;}
.btn-9x:hover{filter:brightness(1.1);}
.btn-success{background:#2e7d32;color:#fff;border-color:#2e7d32;}
.btn-success:hover{filter:brightness(1.1);}
.btn-9x-small{
  background:#ff9800;color:#fff;border:none;
  padding:2px 8px;border-radius:12px;font-size:10px;cursor:pointer;
}
.btn-9x-small:hover{filter:brightness(1.1);}
.filter-checkbox{display:flex;align-items:center;gap:4px;font-size:11px;cursor:pointer;color:#666;}
body.dark .filter-checkbox{color:#999;}
.filter-checkbox input{accent-color:#1976d2;cursor:pointer;}

.stats{padding:6px 10px;font-size:11px;color:#666;border-bottom:1px solid #e0e0e0;flex-shrink:0;display:flex;justify-content:space-between;}
body.dark .stats{color:#999;border-color:#333;}
.stats .left{display:flex;gap:8px;}

#linkContainer{flex:1;min-height:0;overflow-y:auto;}

.link-card{
  display:flex;flex-direction:column;gap:3px;
  padding:8px 10px;border-bottom:1px solid #e0e0e0;
}
body.dark .link-card{border-color:#333;}
.link-card:hover{background:#f5f5f5;}
body.dark .link-card:hover{background:#2a2a2a;}
.link-card.selected{background:#e3f2fd;}
body.dark .link-card.selected{background:#1a3a5c;}

.link-row{display:flex;align-items:center;gap:8px;}
.link-checkbox{flex:0 0 auto;margin:0;cursor:pointer;accent-color:#1976d2;}
.media-preview{width:72px;height:42px;object-fit:cover;border-radius:3px;background:#d9dee5;flex:0 0 auto;display:block;}
.media-type{background:#1976d2;color:#fff!important;}
.link-url{
  font-size:12px;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  color:#444;
}
body.dark .link-url{color:#bbb;}
.link-actions{display:flex;gap:3px;flex:0 0 auto;align-items:center;}
.link-actions button{
  background:transparent;border:1px solid transparent;
  color:#666;font-size:11px;padding:2px 6px;border-radius:3px;line-height:1;
}
body.dark .link-actions button{color:#999;}
.link-actions button:hover{background:#1976d2;color:#fff;border-color:#1976d2;}
.link-actions button.disabled{opacity:.4;cursor:not-allowed;}

.link-meta{display:flex;gap:6px;flex-wrap:wrap;font-size:10px;color:#666;padding-left:22px;}
body.dark .link-meta{color:#999;}
.link-meta span{background:rgba(0,0,0,0.05);padding:1px 6px;border-radius:10px;}
body.dark .link-meta span{background:rgba(255,255,255,0.08);}
.link-meta .type-badge.direct{background:#4caf50;color:#fff;}
.link-meta .type-badge.page{background:#ff9800;color:#fff;}
.link-meta .type-badge.stream{background:#1976d2;color:#fff;}

.empty-state{padding:40px 20px;text-align:center;color:#999;font-size:12px;}

footer{
  padding:8px 10px;border-top:1px solid #e0e0e0;
  display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;
}
body.dark footer{border-color:#333;}

.toast-message{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  background:#333;color:#fff;padding:6px 16px;border-radius:20px;
  font-size:12px;opacity:0;transition:opacity .2s;
  pointer-events:none;max-width:90%;white-space:nowrap;
}
.toast-message.show{opacity:1;}

::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:#bbb;border-radius:3px;}
body.dark ::-webkit-scrollbar-thumb{background:#444;}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Video Hunter Pro <span class="count-badge" id="countBadge">0</span></h1>
    <button id="settingsBtn" title="Open extension settings">Settings</button>
    <button id="themeBtn" title="Toggle theme" style="padding:2px 8px;">T</button>
  </div>
  <div class="row">
    <div class="radio-group">
      <label><input type="radio" name="typeFilter" value="all"> All</label>
      <label><input type="radio" name="typeFilter" value="video" checked> Videos</label>
      <label><input type="radio" name="typeFilter" value="audio"> Audio</label>
      <label><input type="radio" name="typeFilter" value="thumbnail"> Thumbnails</label>
      <label><input type="radio" name="typeFilter" value="stream"> Streams</label>
    </div>
  </div>
  <div class="row">
    <select id="sortBy" style="flex:1;">
      <option value="date-desc">Newest</option>
      <option value="size-desc" selected>Size down</option>
      <option value="size-asc">Size up</option>
      <option value="name-asc">Name A-Z</option>
      <option value="host-asc">Host A-Z</option>
    </select>
    <input id="minSize" type="text" inputmode="decimal" maxlength="24" placeholder="Min size (e.g. 10GB)" title="Minimum file size, such as 10KB or 10GB" style="flex:1;">
  </div>
  <div class="row">
    <input type="text" id="searchBox" placeholder="Search URL or title...">
  </div>
</header>

<div class="stats">
  <div class="left">
    <span id="linkCount">0 links</span>
    <span id="selectedCount">0 selected</span>
    <span id="timestamp">auto-detect</span>
  </div>
  <div>
    <button id="exportBtn" style="padding:1px 6px;font-size:10px;">Export</button>
    <button id="importBtn" style="padding:1px 6px;font-size:10px;">Import</button>
  </div>
</div>

<div id="linkContainer">
  <div class="empty-state">No media found yet.<br>Play a video or scroll for images.</div>
</div>

<footer>
  <button id="selectAllBtn">All</button>
  <button id="selectAllBtnHidden" style="display:none;"></button>
  <button id="copySelectedBtn">Copy</button>
  <button id="openSelectedBtn">Open</button>
  <button id="clearBtn">Clear</button>
  <button id="btn9xCurrentPage" class="btn-9x">9xBuddy</button>
  <button id="downloadSelectedBtn" class="btn-success">Download</button>
  <label class="filter-checkbox" title="Show only direct video files">
    <input type="checkbox" id="directOnlyRadio"> Direct only
  </label>
  <input type="checkbox" id="filterDirectCheck" style="display:none;">
</footer>

<div id="toast" class="toast-message"></div>

<script src="media-formats.js"></script>
<script src="size-utils.js"></script>
<script src="streaming-sites.js"></script>
<script src="popup.js"></script>
</body>
</html>
